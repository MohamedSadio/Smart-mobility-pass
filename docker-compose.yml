version: '3.8'

# Ajouts de Aziz — Orchestration complète du projet Smart Mobility Pass — 2026-02-21
services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: smart_mobility_user_db
    ports:
      - "3306:3306"
    networks:
      - smart-mobility-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trip_db
    ports:
      - "5432:5432"
    networks:
      - smart-mobility-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - smart-mobility-network

  config-server:
    build:
      context: ./config-server/config-server
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    networks:
      - smart-mobility-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 10s
      retries: 10

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - smart-mobility-network
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 10s
      retries: 5

  # Ajouts de Aziz — Orchestration complète du projet Smart Mobility Pass — 2026-02-21
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - smart-mobility-network
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  user-mobility-pass-service:
    build:
      context: ./user-mobility-pass-service/user-mobility-pass-service
      dockerfile: Dockerfile
    container_name: user-mobility-pass-service
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - smart-mobility-network
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  trip-management-service:
    build:
      context: ./trip-management-service/trip-management-service/trip-management-service
      dockerfile: Dockerfile
    container_name: trip-management-service
    ports:
      - "8081:8081" # Conflicting port intentionally? Configured based on original yml
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - smart-mobility-network
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  pricing-discount-service:
    build:
      context: ./pricing-discount-service/pricing-discount-service/pricing-discount-service
      dockerfile: Dockerfile
    container_name: pricing-discount-service
    ports:
      - "8082:8082"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - smart-mobility-network
    environment:
      - SPRING_PROFILES_ACTIVE=dev

networks:
  smart-mobility-network:
    driver: bridge
