# Service Configuration
billing-service.type=unique-default
billing-service.name=User-Mobility-Pass-Service
billing-service.profile=dev
billing-service.port=8085

# MySQL Database Configuration
billing-service.mysql.url=jdbc:mysql://localhost:3306/smart_mobility_biling_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
billing-service.mysql.username=root
billing-service.mysql.password=
billing-service.mysql.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
billing-service.jpa.hibernate.ddl-auto=create
billing-service.jpa.show-sql=true
billing-service.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka