# Service Configuration
notification-service.type=unique-default
notification-service.name=User-Mobility-Pass-Service
notification-service.profile=dev
notification-service.port=8086

# MySQL Database Configuration
notification-service.mysql.url=jdbc:mysql://localhost:3306/smart_mobility_notification_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
notification-service.mysql.username=root
notification-service.mysql.password=
notification-service.mysql.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
notification-service.jpa.hibernate.ddl-auto=update
notification-service.jpa.show-sql=true
notification-service.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

notification-service.RABBITMQ_HOST=localhost
notification-service.RABBITMQ_PORT=5672
notification-service.RABBITMQ_USER=guest
notification-service.RABBITMQ_PASS=guest