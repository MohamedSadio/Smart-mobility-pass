# Service Configuration
pricing-discount-service.type=unique-default
pricing-discount-service.name=Pricing-discount-Service
pricing-discount-service.profile=dev
pricing-discount-service.port=8084

pricing-discount-service.urlregistry=http://localhost:8761/eureka

# Business Rules - Prix de base par transport (FCFA)
pricing.base-fare.bus=200
pricing.base-fare.brt=300
pricing.base-fare.ter=500

# Business Rules - Prix par kilomètre (FCFA/km)
pricing.price-per-km.bus=50
pricing.price-per-km.brt=75
pricing.price-per-km.ter=100

# Business Rules - Réductions (%)
pricing.discount.off-peak=20
pricing.discount.loyalty.bronze=5
pricing.discount.loyalty.silver=10
pricing.discount.loyalty.gold=15
pricing.discount.subscription.monthly=10
pricing.discount.subscription.annual=20

# Business Rules - Plafonnement journalier (FCFA)
pricing.daily-cap.bus=1500
pricing.daily-cap.brt=2000
pricing.daily-cap.ter=3000

# Heures creuses
pricing.off-peak.start-time=09:00
pricing.off-peak.end-time=16:00

# Seuils de fidélité (points)
pricing.loyalty.bronze-threshold=50
pricing.loyalty.silver-threshold=150
pricing.loyalty.gold-threshold=300

# Logging
logging.level.com.smartmobility.pricing=DEBUG