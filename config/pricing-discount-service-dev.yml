# fix(config): fichier de configuration centralisee pour pricing-discount-service profil dev 2026-02-22
server:
  port: 8082

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

pricing:
  rules:
    base-rate-per-km: 100
    off-peak:
      enabled: true
      discount-rate: 0.10
      start-hour: 20
      end-hour: 6
    loyalty:
      enabled: true
      discount-rate: 0.05
      min-trips: 10
    daily-cap: 3000

logging:
  level:
    com.smartmobility.pricing: DEBUG
