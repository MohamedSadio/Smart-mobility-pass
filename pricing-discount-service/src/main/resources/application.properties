# Config Server Connection
spring.config.import=optional:configserver:http://localhost:8888

# Service Identity
spring.application.name=pricing-discount-service
spring.profiles.active=dev

# Port
server.port=${pricing-discount-service.port}

# Eureka Client
eureka.client.service-url.defaultZone=${pricing-discount-service.urlregistry}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.smartmobility.pricing=INFO

# Envoyer 100% des traces (1.0 = 100%, 0.1 = 10%)
management.tracing.sampling.probability=1.0

# URL du serveur Zipkin
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

# Resilience4J ? Retry
resilience4j.retry.instances.pricingRetry.max-attempts=3
resilience4j.retry.instances.pricingRetry.wait-duration=500ms