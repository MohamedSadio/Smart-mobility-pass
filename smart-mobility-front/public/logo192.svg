<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradient for modern look -->
  <defs>
    <linearGradient id="transportGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#transportGradient)" filter="url(#shadow)"/>
  
  <!-- Bus/Vehicle body -->
  <g transform="translate(100, 100)">
    <!-- Main bus body -->
    <rect x="-50" y="-20" width="100" height="45" rx="8" fill="white" opacity="0.95"/>
    
    <!-- Windows -->
    <rect x="-40" y="-15" width="18" height="12" rx="2" fill="#e0f2fe"/>
    <rect x="-15" y="-15" width="18" height="12" rx="2" fill="#e0f2fe"/>
    <rect x="10" y="-15" width="18" height="12" rx="2" fill="#e0f2fe"/>
    
    <!-- Door -->
    <rect x="32" y="-15" width="12" height="18" rx="2" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
    
    <!-- Front bumper -->
    <rect x="-52" y="26" width="104" height="4" fill="#f3f4f6"/>
    
    <!-- Wheels -->
    <!-- Left wheel -->
    <circle cx="-30" cy="30" r="8" fill="#374151" stroke="#1f2937" stroke-width="1"/>
    <circle cx="-30" cy="30" r="5" fill="none" stroke="#6b7280" stroke-width="1"/>
    
    <!-- Right wheel -->
    <circle cx="30" cy="30" r="8" fill="#374151" stroke="#1f2937" stroke-width="1"/>
    <circle cx="30" cy="30" r="5" fill="none" stroke="#6b7280" stroke-width="1"/>
    
    <!-- Direction arrows above bus (smart mobility concept) -->
    <g stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left arrow -->
      <path d="M -35 -35 L -45 -35 L -40 -30"/>
      <!-- Right arrow -->
      <path d="M 35 -35 L 45 -35 L 40 -30"/>
    </g>
  </g>
</svg>