spring.config.import=optional:configserver:http://localhost:8888
spring.application.name=user-mobility-pass-service

spring.cloud.config.profile=dev

server.port=${user-mobility-pass-service.port}

spring.datasource.url=${user-mobility-pass-service.mysql.url}
spring.datasource.username=${user-mobility-pass-service.mysql.username}
spring.datasource.password=${user-mobility-pass-service.mysql.password}
spring.datasource.driver-class-name=${user-mobility-pass-service.mysql.driver-class-name}

spring.jpa.hibernate.ddl-auto=${user-mobility-pass-service.jpa.hibernate.ddl-auto}
spring.jpa.show-sql=${user-mobility-pass-service.jpa.show-sql}
spring.jpa.properties.hibernate.dialect=${user-mobility-pass-service.jpa.properties.hibernate.dialect}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=eureka.client.service-url.defaultZone
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}

# Envoyer 100% des traces (1.0 = 100%, 0.1 = 10%)
management.tracing.sampling.probability=1.0

# URL du serveur Zipkin
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true



