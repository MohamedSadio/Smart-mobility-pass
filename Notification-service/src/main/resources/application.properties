spring.config.import=optional:configserver:http://localhost:8888
spring.application.name=notification-service

spring.cloud.config.profile=dev

server.port=${notification-service.port}

spring.datasource.url=${notification-service.mysql.url}
spring.datasource.username=${notification-service.mysql.username}
spring.datasource.password=${notification-service.mysql.password}
spring.datasource.driver-class-name=${notification-service.mysql.driver-class-name}

spring.jpa.hibernate.ddl-auto=${notification-service.jpa.hibernate.ddl-auto}
spring.jpa.show-sql=${notification-service.jpa.show-sql}
spring.jpa.properties.hibernate.dialect=${notification-service.jpa.properties.hibernate.dialect}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${eureka.client.service-url.defaultZone}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}

spring.rabbitmq.host=${notification-service.RABBITMQ_HOST}
spring.rabbitmq.port=${notification-service.RABBITMQ_PORT}
spring.rabbitmq.username=${notification-service.RABBITMQ_USER}
spring.rabbitmq.password=${notification-service.RABBITMQ_PASS}

resilience4j.retry.instances.notification-service.max-attempts=3
resilience4j.retry.instances.notification-service.wait-duration=2s

# Envoyer 100% des traces (1.0 = 100%, 0.1 = 10%)
management.tracing.sampling.probability=1.0

# URL du serveur Zipkin
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
