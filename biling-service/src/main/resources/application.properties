spring.config.import=optional:configserver:http://localhost:8888
spring.application.name=billing-service

spring.cloud.config.profile=dev

server.port=${billing-service.port}

spring.datasource.url=${billing-service.mysql.url}
spring.datasource.username=${billing-service.mysql.username}
spring.datasource.password=${billing-service.mysql.password}
spring.datasource.driver-class-name=${billing-service.mysql.driver-class-name}

spring.jpa.hibernate.ddl-auto=${billing-service.jpa.hibernate.ddl-auto}
spring.jpa.show-sql=${billing-service.jpa.show-sql}
spring.jpa.properties.hibernate.dialect=${billing-service.jpa.properties.hibernate.dialect}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${eureka.client.service-url.defaultZone}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}

spring.rabbitmq.host=${biling-service.RABBITMQ_HOST}
spring.rabbitmq.port=${biling-service.RABBITMQ_PORT}
spring.rabbitmq.username=${biling-service.RABBITMQ_USER}
spring.rabbitmq.password=${biling-service.RABBITMQ_PASS}

# Envoyer 100% des traces (1.0 = 100%, 0.1 = 10%)
management.tracing.sampling.probability=1.0

# URL du serveur Zipkin
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans