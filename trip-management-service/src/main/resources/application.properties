spring.config.import=optional:configserver:http://localhost:8888
spring.application.name=trip-management-service

spring.cloud.config.profile=dev

server.port=${trip-management-service.port}

spring.datasource.url=${trip-management-service.mysql.url}
spring.datasource.username=${trip-management-service.mysql.username}
spring.datasource.password=${trip-management-service.mysql.password}
spring.datasource.driver-class-name=${trip-management-service.mysql.driver-class-name}

spring.jpa.hibernate.ddl-auto=${trip-management-service.jpa.hibernate.ddl-auto}
spring.jpa.show-sql=${trip-management-service.jpa.show-sql}
spring.jpa.properties.hibernate.dialect=${trip-management-service.jpa.properties.hibernate.dialect}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${eureka.client.service-url.defaultZone}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}

spring.rabbitmq.host=${trip-management-service.RABBITMQ_HOST}
spring.rabbitmq.port=${trip-management-service.RABBITMQ_PORT}
spring.rabbitmq.username=${trip-management-service.RABBITMQ_USER}
spring.rabbitmq.password=${trip-management-service.RABBITMQ_PASS}

# Envoyer 100% des traces (1.0 = 100%, 0.1 = 10%)
management.tracing.sampling.probability=1.0

# URL du serveur Zipkin
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans

# trip-management-service ? application.properties
spring.cloud.openfeign.client.config.pricing-discount-service.connect-timeout=1000
spring.cloud.openfeign.client.config.pricing-discount-service.read-timeout=2000